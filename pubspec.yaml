name: warung_makan
description: Aplikasi Warung Makan dengan GetX
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6

  # Networking
  http: ^1.1.0
  dio: ^5.4.0   # ⬅️ TURUN (aman SDK 34)

  # Env
  flutter_dotenv: ^6.0.0

  # Storage
  shared_preferences: ^2.2.2   # ⬅️ TURUN
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Supabase
  supabase_flutter: ^2.10.3

  # Isar (WAJIB versi stabil)
  isar_flutter_libs: 4.0.0-dev.13


  # Utils
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.2   # ⬅️ TURUN

  # Media & Permission
  image_picker: ^1.1.2
  permission_handler: ^10.4.3

  # UI
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^2.32.0
  firebase_messaging: ^14.9.4

  # Location
  geolocator: ^10.1.0
  geocoding: ^3.0.0

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Notifications
  flutter_local_notifications: ^16.3.3
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
